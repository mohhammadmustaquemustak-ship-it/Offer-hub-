<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offer Hub | Earn Daily Rewards Online</title>
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* ROOT VARIABLES & RESET */
        :root {
            --bg-color: #0F172A;
            --primary-blue: #3B82F6;
            --primary-blue-hover: #2563EB;
            --purple-accent: #8B5CF6;
            --text-white: #F8FAFC;
            --text-gray: #94A3B8;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
            --transition: all 0.3s ease;
            --whatsapp-green: #25D366;
            --gold: #F59E0B;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-white);
            overflow-x: hidden;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* TYPOGRAPHY & UTILITIES */
        .text-gradient {
            background: linear-gradient(to right, var(--primary-blue), var(--purple-accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .section-header {
            text-align: center;
            margin-bottom: 50px;
        }

        .section-header h2 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .section-header p {
            color: var(--text-gray);
        }

        /* GLASSMORPHISM CLASS */
        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        /* BUTTONS */
        .btn {
            display: inline-block;
            padding: 10px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            border: none;
            outline: none;
            text-align: center;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-blue), var(--purple-accent));
            color: white;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
        }

        .btn-primary:hover {
            box-shadow: 0 6px 20px rgba(139, 92, 246, 0.6);
            transform: translateY(-2px);
        }

        .btn-outline {
            background: transparent;
            color: var(--text-white);
            border: 1px solid var(--primary-blue);
        }

        .btn-outline:hover {
            background: rgba(59, 130, 246, 0.1);
        }

        .btn-whatsapp {
            background: transparent;
            color: var(--whatsapp-green);
            border: 1px solid var(--whatsapp-green);
        }

        .btn-whatsapp:hover {
            background: rgba(37, 211, 102, 0.1);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.2);
        }

        .btn-lg {
            padding: 14px 32px;
            font-size: 1.1rem;
        }

        .btn-sm {
            padding: 8px 16px;
            font-size: 0.9rem;
        }

        /* NAVBAR & COIN SECTION */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            transition: var(--transition);
            padding: 20px 0;
        }

        header.scrolled {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            padding: 15px 0;
            border-bottom: 1px solid var(--glass-border);
        }

        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--text-white);
            text-decoration: none;
            letter-spacing: 1px;
        }

        .logo span {
            color: var(--primary-blue);
        }

        .nav-links {
            display: flex;
            align-items: center;
        }

        .nav-links a {
            color: var(--text-gray);
            text-decoration: none;
            margin: 0 12px;
            font-weight: 500;
            transition: var(--transition);
            font-size: 0.95rem;
        }

        .nav-links a:hover {
            color: var(--text-white);
        }
        
        .nav-actions {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* User Balance Box */
        .user-balance-box {
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid var(--gold);
            padding: 6px 15px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: bold;
            color: var(--gold);
        }

        .user-balance-box i {
            animation: pulsePlay 2s infinite;
        }

        .hamburger {
            display: none;
            font-size: 1.5rem;
            cursor: pointer;
        }

        /* HERO SECTION */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            position: relative;
            padding-top: 80px;
            overflow: hidden;
        }

        .glow-circle {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            z-index: -1;
        }

        .shape-1 {
            width: 400px;
            height: 400px;
            background: rgba(59, 130, 246, 0.3);
            top: -100px;
            left: -100px;
        }

        .shape-2 {
            width: 300px;
            height: 300px;
            background: rgba(139, 92, 246, 0.2);
            bottom: 10%;
            right: 5%;
        }

        .hero-content {
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
            position: relative;
        }

        .hero-title {
            font-size: 4rem;
            line-height: 1.2;
            margin-bottom: 20px;
        }

        .hero-subtitle {
            font-size: 1.2rem;
            color: var(--text-gray);
            margin-bottom: 40px;
        }

        .hero-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .floating-coins {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        .coin {
            position: absolute;
            font-size: 2.5rem;
            color: var(--gold);
            animation: float 4s ease-in-out infinite;
        }

        .coin-1 { top: 20%; left: 10%; animation-delay: 0s; }
        .coin-2 { top: 50%; right: 15%; animation-delay: 1s; font-size: 3rem; }
        .coin-3 { bottom: 20%; left: 20%; animation-delay: 2s; color: #10B981;}

        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(10deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        /* STATS SECTION */
        .stats { padding: 50px 0; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; }
        .stat-card { padding: 30px 20px; text-align: center; transition: var(--transition); }
        .stat-card:hover { transform: translateY(-5px); border-color: rgba(59, 130, 246, 0.5); box-shadow: 0 0 20px rgba(59, 130, 246, 0.2); }
        .stat-icon { font-size: 2rem; color: var(--primary-blue); margin-bottom: 15px; }
        .stat-card h3 { font-size: 2rem; margin-bottom: 5px; }
        .stat-card p { color: var(--text-gray); font-size: 0.9rem; }

        /* HOW IT WORKS, FEATURES */
        .how-it-works, .features, .watch-ads, .offerwall, .withdraw, .testimonials, .faq, .games-section { padding: 80px 0; }
        .steps-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 30px; position: relative; }
        .step-card { padding: 40px 30px; text-align: center; position: relative; }
        .step-number { position: absolute; top: -20px; left: 50%; transform: translateX(-50%); width: 40px; height: 40px; background: linear-gradient(135deg, var(--primary-blue), var(--purple-accent)); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 1.2rem; }
        .step-card i { font-size: 2.5rem; color: var(--purple-accent); margin: 20px 0; }

        .features-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; }
        .feature-card { padding: 30px; transition: var(--transition); }
        .feature-card:hover { transform: translateY(-10px); background: rgba(255, 255, 255, 0.05); }
        .feature-card i { font-size: 2rem; color: var(--primary-blue); margin-bottom: 15px; }
        .feature-card h3 { margin-bottom: 10px; }
        .feature-card p { color: var(--text-gray); font-size: 0.95rem; }

        /* GAMES SECTION (SPIN & SCRATCH) */
        .games-grid { display: flex; flex-wrap: wrap; gap: 40px; justify-content: center; }
        .game-card { flex: 1; min-width: 300px; max-width: 500px; padding: 40px; text-align: center; display: flex; flex-direction: column; align-items: center; }
        
        .wheel-container { position: relative; width: 250px; height: 250px; margin: 20px auto; }
        .wheel { width: 100%; height: 100%; border-radius: 50%; border: 5px solid var(--primary-blue); background: conic-gradient( #3B82F6 0deg 45deg, #8B5CF6 45deg 90deg, #10B981 90deg 135deg, #F59E0B 135deg 180deg, #EF4444 180deg 225deg, #EC4899 225deg 270deg, #14B8A6 270deg 315deg, #6366F1 315deg 360deg ); transition: transform 3s cubic-bezier(0.1, 0.7, 0.1, 1); box-shadow: 0 0 20px rgba(59, 130, 246, 0.4); }
        .wheel-pointer { position: absolute; top: -15px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent; border-top: 30px solid #ffffff; z-index: 10; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); }
        .wheel-inner { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 50px; height: 50px; background: var(--bg-color); border-radius: 50%; border: 3px solid var(--text-white); z-index: 5; }

        .scratch-container { position: relative; width: 100%; height: 200px; margin: 20px auto; border-radius: 12px; overflow: hidden; background: #1E293B; border: 2px dashed var(--purple-accent); display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .scratch-result { font-size: 2rem; font-weight: bold; color: var(--gold); }
        .scratch-cover { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #475569, #334155); display: flex; align-items: center; justify-content: center; transition: opacity 0.5s ease; z-index: 2; }
        .scratch-cover.scratched { opacity: 0; pointer-events: none; }
        .game-status { color: var(--text-gray); margin-bottom: 15px; font-size: 1.1rem; }

        /* MODAL STYLES */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(5px); display: flex; align-items: center; justify-content: center; z-index: 2000; opacity: 0; visibility: hidden; transition: var(--transition); }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-content { background: var(--bg-color); border: 1px solid var(--primary-blue); padding: 40px; border-radius: 16px; text-align: center; max-width: 400px; width: 90%; transform: translateY(20px); transition: var(--transition); box-shadow: 0 0 30px rgba(59, 130, 246, 0.3); }
        .modal-overlay.active .modal-content { transform: translateY(0); }
        .modal-icon { font-size: 4rem; color: var(--gold); margin-bottom: 20px; animation: pulsePlay 2s infinite; }
        .modal-title { font-size: 1.8rem; margin-bottom: 10px; }
        .modal-text { color: var(--text-gray); margin-bottom: 25px; }

        /* WATCH ADS & PREMIUM ADS SECTION */
        .ads-container-wrapper { display: flex; flex-wrap: wrap; gap: 30px; justify-content: center; }
        .watch-ads-card, .premium-ads-card { text-align: center; padding: 50px 30px; flex: 1; min-width: 300px; max-width: 500px; position: relative; overflow: hidden; transition: var(--transition); }
        .watch-ads-card { border-top: 3px solid var(--primary-blue); }
        .premium-ads-card { border-top: 3px solid var(--purple-accent); }
        .watch-ads-card:hover, .premium-ads-card:hover { box-shadow: 0 0 30px rgba(59, 130, 246, 0.2); transform: translateY(-5px); }
        .play-icon-large { font-size: 4rem; color: var(--primary-blue); margin-bottom: 20px; display: inline-block; animation: pulsePlay 2s infinite; }
        .premium-icon { color: var(--purple-accent); animation: pulsePremium 2s infinite; }

        @keyframes pulsePlay {
            0% { transform: scale(1); text-shadow: 0 0 0 rgba(59, 130, 246, 0.7); }
            50% { transform: scale(1.1); text-shadow: 0 0 20px rgba(59, 130, 246, 0.4); }
            100% { transform: scale(1); text-shadow: 0 0 0 rgba(59, 130, 246, 0); }
        }
        @keyframes pulsePremium {
            0% { transform: scale(1); text-shadow: 0 0 0 rgba(139, 92, 246, 0.7); }
            50% { transform: scale(1.1); text-shadow: 0 0 20px rgba(139, 92, 246, 0.4); }
            100% { transform: scale(1); text-shadow: 0 0 0 rgba(139, 92, 246, 0); }
        }

        /* TIMER ALERT MODAL */
        .alert-box {
            position: fixed; top: 20px; right: 20px; background: rgba(15, 23, 42, 0.95); border-left: 4px solid var(--gold); padding: 15px 25px; border-radius: 8px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); z-index: 3000; color: white; transform: translateX(150%); transition: transform 0.4s ease; display: flex; align-items: center; gap: 15px;
        }
        .alert-box.show { transform: translateX(0); }

        /* OFFERWALL & WITHDRAW */
        .offers-grid { display: flex; flex-direction: column; gap: 15px; max-width: 800px; margin: 0 auto; }
        .offer-card { display: flex; align-items: center; padding: 20px; transition: var(--transition); }
        .offer-card:hover { background: rgba(255, 255, 255, 0.05); border-color: var(--primary-blue); }
        .offer-icon { width: 60px; height: 60px; background: rgba(59, 130, 246, 0.1); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; color: var(--primary-blue); margin-right: 20px; }
        .offer-details { flex: 1; }
        .offer-details h4 { font-size: 1.2rem; margin-bottom: 5px; }
        .offer-details p { color: var(--text-gray); font-size: 0.95rem; }
        .offer-action { display: flex; flex-direction: column; align-items: flex-end; gap: 15px; }
        .reward { font-weight: bold; color: #10B981; font-size: 1.5rem; }
        .action-buttons { display: flex; gap: 10px; }

        .withdraw-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 30px; max-width: 1000px; margin: 0 auto; }
        .withdraw-card { padding: 30px; text-align: center; position: relative; cursor: pointer; transition: var(--transition); }
        .withdraw-card:hover { transform: translateY(-5px); box-shadow: 0 0 20px rgba(139, 92, 246, 0.3); }
        .badge-instant { position: absolute; top: 10px; right: 10px; background: #10B981; color: white; font-size: 0.7rem; padding: 3px 8px; border-radius: 10px; font-weight: bold; }
        .w-icon { width: 70px; height: auto; margin-bottom: 15px; }
        .invert-safe { filter: brightness(0) invert(1); }
        .withdraw-card p { color: var(--text-gray); font-size: 1rem; margin-top: 10px; font-weight: 500; }

        /* TESTIMONIALS & FAQ */
        .testi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; }
        .testi-card { padding: 30px; }
        .stars { color: #F59E0B; margin-bottom: 15px; }
        .testi-card p { font-style: italic; margin-bottom: 20px; color: #E2E8F0; }
        .user-info { display: flex; align-items: center; gap: 15px; }
        .user-info img { width: 50px; border-radius: 50%; }
        .user-info span { font-size: 0.8rem; color: var(--text-gray); }

        .faq-container { max-width: 800px; margin: 0 auto; padding: 10px 20px; }
        .faq-item { border-bottom: 1px solid var(--glass-border); padding: 15px 0; }
        .faq-question { display: flex; justify-content: space-between; align-items: center; cursor: pointer; padding: 10px 0; }
        .faq-answer { max-height: 0; overflow: hidden; transition: var(--transition); }
        .faq-answer p { padding-bottom: 15px; color: var(--text-gray); }
        .faq-item.active .faq-answer { max-height: 200px; }
        .faq-item.active .faq-question i { transform: rotate(180deg); }

        /* FOOTER */
        .footer { background: rgba(0, 0, 0, 0.5); padding: 60px 0 20px; border-top: 1px solid var(--glass-border); }
        .footer-grid { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 40px; margin-bottom: 40px; }
        .footer-brand p { color: var(--text-gray); margin: 15px 0; max-width: 300px; }
        .social-links a { color: var(--text-white); font-size: 1.2rem; margin-right: 15px; transition: var(--transition); }
        .social-links a:hover { color: var(--primary-blue); }
        .footer-links h4 { margin-bottom: 20px; }
        .footer-links a { display: block; color: var(--text-gray); text-decoration: none; margin-bottom: 10px; transition: var(--transition); }
        .footer-links a:hover { color: var(--primary-blue); padding-left: 5px; }
        .footer-bottom { text-align: center; padding-top: 20px; border-top: 1px solid var(--glass-border); color: var(--text-gray); font-size: 0.9rem; }

        /* RESPONSIVE DESIGN */
        @media (max-width: 768px) {
            .nav-links, .nav-btn { display: none; }
            .hamburger { display: block; }
            .nav-actions { gap: 10px; }
            
            .nav-links.active {
                display: flex;
                flex-direction: column;
                position: absolute;
                top: 100%;
                left: 0;
                width: 100%;
                background: rgba(15, 23, 42, 0.95);
                backdrop-filter: blur(10px);
                padding: 20px;
                border-bottom: 1px solid var(--glass-border);
            }
            .nav-links.active a { margin: 10px 0; }
            
            .hero-buttons { flex-direction: column; }
            .hero-title { font-size: 3rem; }
            .offer-card { flex-direction: column; text-align: center; }
            .offer-icon { margin-right: 0; margin-bottom: 15px; }
            .offer-action { align-items: center; margin-top: 15px; }
            .action-buttons { flex-direction: column; width: 100%; }
            .footer-grid { grid-template-columns: 1fr; }
            .alert-box { width: 90%; right: 5%; }
        }
    </style>
</head>
<body>

    <!-- ALERT NOTIFICATION -->
    <div class="alert-box" id="custom-alert
